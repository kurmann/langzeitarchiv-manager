[build-system]
requires = ["setuptools>=42"]
build-backend = "setuptools.build_meta"

[project]
name = "kurmann-disc-archiver"
version = "0.2.0"
description = "Archivfeste Sicherung von Verzeichnissen auf optische Medien (BD-R, BD-XL, M-Disc) mit PAR2"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "typer>=0.12",
    "tomli-w>=1.0",
    "rich>=13.0",
]

[project.scripts]
disc-archiver = "disc_archiver.cli:app"

[project.urls]
Homepage = "https://github.com/kurmann/disc-archiver"

[tool.setuptools.packages.find]
where = ["."]
include = ["disc_archiver*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
